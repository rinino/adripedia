<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Il ciclo di generazione di un modello linguistico</title>
  <desc id="desc">Il prompt viene spezzato in token dal tokenizer. Ogni token diventa un vettore numerico. Il transformer calcola, con l'attenzione, una probabilit&#224; per ogni token del vocabolario. Il campionamento sceglie un token, che viene aggiunto al contesto: il ciclo riparte, un token alla volta, fino alla risposta completa.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b08a3e"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .box-title { font: 600 20px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .box-text { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .loop-label { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #b08a3e; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="56" class="label">IL CICLO</text>
  <text x="56" y="94" class="title">Come nasce una parola, un token alla volta</text>
  <text x="56" y="122" class="small">Il modello non scrive la frase intera: sceglie il token successivo, lo aggiunge e ricomincia.</text>

  <!-- Prompt -->
  <rect x="56" y="170" width="170" height="128" rx="14" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="76" y="200" class="label">INPUT</text>
  <text x="76" y="232" class="box-title">Prompt</text>
  <text x="76" y="260" class="box-text">Istruzioni,</text>
  <text x="76" y="282" class="box-text">contesto, esempi.</text>

  <!-- Tokenizer -->
  <rect x="266" y="170" width="170" height="128" rx="14" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="286" y="200" class="label">SCOMPONE</text>
  <text x="286" y="232" class="box-title">Tokenizer</text>
  <text x="286" y="260" class="box-text">Spezza il testo</text>
  <text x="286" y="282" class="box-text">in token.</text>

  <!-- Embedding -->
  <rect x="476" y="170" width="170" height="128" rx="14" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="496" y="200" class="label">NUMERI</text>
  <text x="496" y="232" class="box-title">Embedding</text>
  <text x="496" y="260" class="box-text">Ogni token &#232;</text>
  <text x="496" y="282" class="box-text">un vettore.</text>

  <!-- Transformer -->
  <rect x="686" y="170" width="190" height="128" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="706" y="200" class="label">CALCOLA</text>
  <text x="706" y="232" class="box-title">Transformer</text>
  <text x="706" y="260" class="box-text">Pesa le relazioni</text>
  <text x="706" y="282" class="box-text">tra i token.</text>

  <!-- Probabilita -->
  <rect x="916" y="170" width="228" height="128" rx="14" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="936" y="200" class="label">PREVEDE</text>
  <text x="936" y="232" class="box-title">Probabilit&#224;</text>
  <text x="936" y="260" class="box-text">Un punteggio per ogni</text>
  <text x="936" y="282" class="box-text">token del vocabolario.</text>

  <!-- Frecce -->
  <line x1="234" y1="234" x2="258" y2="234" stroke="#1f6fb2" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="444" y1="234" x2="468" y2="234" stroke="#1f6fb2" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="654" y1="234" x2="678" y2="234" stroke="#1f6fb2" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="884" y1="234" x2="908" y2="234" stroke="#1f6fb2" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Campionamento -->
  <rect x="916" y="350" width="228" height="128" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="936" y="380" class="label">SCEGLIE</text>
  <text x="936" y="412" class="box-title">Campionamento</text>
  <text x="936" y="440" class="box-text">Temperatura e top-p</text>
  <text x="936" y="462" class="box-text">decidono quanto osare.</text>

  <line x1="1030" y1="298" x2="1030" y2="342" stroke="#1f6fb2" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Ciclo -->
  <path d="M 1030 478 L 1030 496 Q 1030 512 1014 512 L 157 512 Q 141 512 141 496 L 141 306"
        fill="none" stroke="#b08a3e" stroke-width="3" marker-end="url(#arrow-gold)"/>
  <text x="300" y="500" class="loop-label">Il token scelto si aggiunge al contesto: il ciclo riparte.</text>
  <text x="300" y="540" class="tiny">Un token alla volta, fino alla risposta completa.</text>
</svg>
