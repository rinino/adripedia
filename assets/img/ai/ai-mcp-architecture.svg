<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="titolo-mcp">
  <title id="titolo-mcp">Architettura MCP: host, client, server e confine di sicurezza</title>
  <defs>
    <marker id="freccia-mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="598" rx="14" fill="#ffffff" stroke="#d7dee8"/>

  <text x="48" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Architettura MCP</text>
  <text x="48" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#5b6573">Un host, più client, un server per client. Ogni freccia è una chiamata JSON-RPC.</text>

  <rect x="48" y="110" width="430" height="400" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="72" y="146" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Host</text>
  <text x="72" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">l’applicazione che parla con i server</text>

  <rect x="68" y="196" width="390" height="130" rx="8" fill="#eaf2fb" stroke="#2f6fb3"/>
  <text x="92" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Client 1</text>
  <text x="92" y="256" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">trasporto: stdio</text>
  <text x="92" y="280" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">server: catalogo locale</text>

  <rect x="68" y="346" width="390" height="130" rx="8" fill="#eaf2fb" stroke="#2f6fb3"/>
  <text x="92" y="378" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Client 2</text>
  <text x="92" y="406" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">trasporto: Streamable HTTP</text>
  <text x="92" y="430" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">server: remoto</text>

  <rect x="600" y="96" width="560" height="430" rx="12" fill="#ffffff" stroke="#b8762a" stroke-dasharray="8 6"/>
  <rect x="630" y="120" width="500" height="170" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="654" y="154" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Server locale</text>
  <text x="654" y="182" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">trasporto: stdio</text>
  <text x="654" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">espone: tool, resource, prompt</text>
  <text x="654" y="238" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">eredita i permessi del processo</text>

  <rect x="630" y="310" width="500" height="170" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="654" y="344" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Server remoto</text>
  <text x="654" y="372" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">trasporto: Streamable HTTP</text>
  <text x="654" y="400" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">espone: tool, resource, prompt</text>
  <text x="654" y="428" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">richiede autenticazione e consenso</text>

  <text x="630" y="505" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#b8762a">confine di sicurezza</text>

  <line x1="458" y1="250" x2="624" y2="205" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-mcp)"/>
  <line x1="458" y1="411" x2="624" y2="395" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-mcp)"/>

  <text x="520" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2f6fb3">JSON-RPC</text>
  <text x="48" y="570" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">Il tratteggio separa ciò che gira in locale da ciò che attraversa la rete.</text>
</svg>
