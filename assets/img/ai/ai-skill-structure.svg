<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="titolo-skill">
  <title id="titolo-skill">Struttura di una skill e caricamento progressivo</title>
  <defs>
    <marker id="freccia-skill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="638" rx="14" fill="#ffffff" stroke="#d7dee8"/>

  <text x="48" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Com’è fatta una skill</text>
  <text x="48" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#5b6573">Una cartella, un file di istruzioni, tre livelli di caricamento.</text>

  <rect x="48" y="110" width="470" height="330" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="72" y="146" font-family="'Consolas', monospace" font-size="16" font-weight="700" fill="#1f2937">mia-skill/</text>
  <text x="72" y="178" font-family="'Consolas', monospace" font-size="13" fill="#1f2937">&#9500;&#9472;&#9472; SKILL.md</text>
  <text x="72" y="204" font-family="'Consolas', monospace" font-size="13" fill="#1f2937">&#9500;&#9472;&#9472; scripts/</text>
  <text x="72" y="230" font-family="'Consolas', monospace" font-size="13" fill="#1f2937">&#9500;&#9472;&#9472; references/</text>
  <text x="72" y="256" font-family="'Consolas', monospace" font-size="13" fill="#1f2937">&#9492;&#9472;&#9472; assets/</text>
  <text x="72" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">SKILL.md: metadati e istruzioni</text>
  <text x="72" y="326" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">scripts/: logica deterministica</text>
  <text x="72" y="352" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">references/: dettagli da consultare</text>
  <text x="72" y="378" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">assets/: modelli e file statici</text>

  <rect x="560" y="110" width="592" height="95" rx="10" fill="#eaf2fb" stroke="#2f6fb3"/>
  <text x="584" y="144" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">1 · Metadati — ~100 token</text>
  <text x="584" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">name e description: si caricano all’avvio, per tutte le skill.</text>

  <rect x="560" y="215" width="592" height="95" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="584" y="249" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">2 · Corpo — &lt; 5.000 token, &lt; 500 righe</text>
  <text x="584" y="277" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">Il SKILL.md completo si carica quando la skill si attiva.</text>

  <rect x="560" y="320" width="592" height="95" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="584" y="354" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">3 · Risorse — a richiesta</text>
  <text x="584" y="382" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">File in scripts/, references/, assets/ caricati solo se servono.</text>

  <rect x="48" y="480" width="250" height="90" rx="10" fill="#eaf6f2" stroke="#2f7d6b"/>
  <text x="68" y="532" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">trigger</text>
  <rect x="318" y="480" width="250" height="90" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="338" y="532" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">metadati</text>
  <rect x="588" y="480" width="250" height="90" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="608" y="532" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">corpo</text>
  <rect x="858" y="480" width="250" height="90" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="878" y="532" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">risorse</text>

  <line x1="298" y1="525" x2="314" y2="525" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-skill)"/>
  <line x1="568" y1="525" x2="584" y2="525" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-skill)"/>
  <line x1="838" y1="525" x2="854" y2="525" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-skill)"/>

  <text x="48" y="606" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">Riferimenti ai file a un solo livello di profondità: niente catene di link difficili da seguire.</text>
</svg>
