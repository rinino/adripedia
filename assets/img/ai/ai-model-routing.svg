<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="titolo-routing">
  <title id="titolo-routing">Routing delle richieste tra modelli e umano</title>
  <defs>
    <marker id="freccia-routing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/>
    </marker>
    <marker id="freccia-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8762a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="14" fill="#ffffff" stroke="#d7dee8"/>

  <text x="48" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Routing delle richieste</text>
  <text x="48" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#5b6573">Una richiesta, tre destinazioni, un ritorno indietro se qualcosa non torna.</text>

  <rect x="48" y="120" width="210" height="120" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="68" y="154" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Richiesta</text>
  <text x="68" y="182" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">testo, immagine,</text>
  <text x="68" y="202" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">allegato</text>

  <rect x="330" y="120" width="230" height="120" rx="10" fill="#eaf2fb" stroke="#2f6fb3"/>
  <text x="350" y="154" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Classificatore</text>
  <text x="350" y="182" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">costo, difficoltà,</text>
  <text x="350" y="202" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">rischio, privacy</text>

  <rect x="660" y="105" width="492" height="78" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="684" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Modello piccolo</text>
  <text x="684" y="164" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">richieste semplici, volume alto, costo basso</text>

  <rect x="660" y="205" width="492" height="78" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="684" y="238" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Modello grande</text>
  <text x="684" y="264" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">ragionamento, contesto lungo, qualità alta</text>

  <rect x="660" y="305" width="492" height="78" rx="10" fill="#fdf3e7" stroke="#b8762a"/>
  <text x="684" y="338" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2937">Umano</text>
  <text x="684" y="364" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">decisioni irreversibili, dati sensibili</text>

  <line x1="258" y1="180" x2="324" y2="180" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-routing)"/>
  <line x1="560" y1="180" x2="654" y2="144" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-routing)"/>
  <line x1="560" y1="180" x2="654" y2="244" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-routing)"/>
  <line x1="560" y1="180" x2="654" y2="344" stroke="#2f6fb3" stroke-width="2" marker-end="url(#freccia-routing)"/>

  <line x1="906" y1="183" x2="906" y2="201" stroke="#b8762a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#freccia-fallback)"/>
  <line x1="906" y1="283" x2="906" y2="301" stroke="#b8762a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#freccia-fallback)"/>

  <rect x="48" y="410" width="1104" height="100" rx="10" fill="#f7f9fc" stroke="#d7dee8"/>
  <text x="76" y="450" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Costo</text>
  <text x="76" y="476" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">basso → alto</text>
  <text x="340" y="450" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Qualità</text>
  <text x="340" y="476" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">buona → massima</text>
  <text x="604" y="450" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Controllo</text>
  <text x="604" y="476" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">automatico → umano</text>
  <text x="868" y="450" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Fallback</text>
  <text x="868" y="476" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5b6573">linea tratteggiata</text>
</svg>
