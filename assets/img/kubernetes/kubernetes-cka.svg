<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
  <title id="title">I cinque domini della certificazione CKA</title>
  <desc id="desc">Troubleshooting pesa il 30 per cento, Cluster Architecture, Installation and Configuration il 25, Services and Networking il 20, Workloads and Scheduling il 15 e Storage il 10. L'esame dura 2 ore, contiene 15-20 task pratici e richiede il 66 per cento. È basato su Kubernetes v1.37, costa 445 dollari e vale 2 anni.</desc>

  <defs>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .domain { font: 600 17px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .pct { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #2383e2; }
      .fact-label { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .fact-value { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .chip { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #1f6fb2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="658" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="64" class="label">CERTIFICAZIONE</text>
  <text x="56" y="100" class="title">CKA: i cinque domini</text>
  <text x="56" y="128" class="small">Linux Foundation Certified Kubernetes Administrator: pesi e dati d'esame.</text>

  <!-- Domini -->
  <text x="56" y="200" class="domain">Troubleshooting</text>
  <text x="696" y="200" class="pct" text-anchor="end">30%</text>
  <rect x="56" y="210" width="600" height="18" rx="9" fill="#eef4fb"/>
  <rect x="56" y="210" width="600" height="18" rx="9" fill="#2383e2"/>

  <text x="56" y="262" class="domain">Cluster Architecture, Installation &amp; Configuration</text>
  <text x="696" y="262" class="pct" text-anchor="end">25%</text>
  <rect x="56" y="272" width="600" height="18" rx="9" fill="#eef4fb"/>
  <rect x="56" y="272" width="500" height="18" rx="9" fill="#3f96e8"/>

  <text x="56" y="324" class="domain">Services &amp; Networking</text>
  <text x="696" y="324" class="pct" text-anchor="end">20%</text>
  <rect x="56" y="334" width="600" height="18" rx="9" fill="#eef4fb"/>
  <rect x="56" y="334" width="400" height="18" rx="9" fill="#62a9ec"/>

  <text x="56" y="386" class="domain">Workloads &amp; Scheduling</text>
  <text x="696" y="386" class="pct" text-anchor="end">15%</text>
  <rect x="56" y="396" width="600" height="18" rx="9" fill="#eef4fb"/>
  <rect x="56" y="396" width="300" height="18" rx="9" fill="#8bc0f1"/>

  <text x="56" y="448" class="domain">Storage</text>
  <text x="696" y="448" class="pct" text-anchor="end">10%</text>
  <rect x="56" y="458" width="600" height="18" rx="9" fill="#eef4fb"/>
  <rect x="56" y="458" width="200" height="18" rx="9" fill="#b9d7f2"/>

  <!-- Scheda esame -->
  <rect x="730" y="160" width="414" height="340" rx="18" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="754" y="192" class="domain">L'esame in breve</text>

  <text x="754" y="232" class="fact-label">Durata</text>
  <text x="754" y="258" class="fact-value">2 ore</text>
  <text x="958" y="232" class="fact-label">Versione</text>
  <text x="958" y="258" class="fact-value">v1.37</text>

  <text x="754" y="300" class="fact-label">Task pratici</text>
  <text x="754" y="326" class="fact-value">15-20</text>
  <text x="958" y="300" class="fact-label">Soglia</text>
  <text x="958" y="326" class="fact-value">66%</text>

  <text x="754" y="368" class="fact-label">Prezzo</text>
  <text x="754" y="394" class="fact-value">445 USD</text>
  <text x="958" y="368" class="fact-label">Validit&#224;</text>
  <text x="958" y="394" class="fact-value">2 anni</text>

  <rect x="754" y="420" width="366" height="54" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="770" y="443" class="tiny">2 tentativi inclusi &#183; 2 simulazioni Killer.sh da 36 ore</text>
  <text x="770" y="462" class="tiny">12 mesi per sostenere l'esame</text>

  <!-- Percorso -->
  <text x="56" y="516" class="domain">Percorso consigliato</text>
  <rect x="56" y="530" width="160" height="42" rx="10" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="136" y="556" class="chip" text-anchor="middle">Linux + kubectl</text>
  <rect x="240" y="530" width="160" height="42" rx="10" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="320" y="556" class="chip" text-anchor="middle">Workload</text>
  <rect x="424" y="530" width="160" height="42" rx="10" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="504" y="556" class="chip" text-anchor="middle">Rete</text>
  <rect x="608" y="530" width="160" height="42" rx="10" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="688" y="556" class="chip" text-anchor="middle">Storage</text>
  <rect x="792" y="530" width="160" height="42" rx="10" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="872" y="556" class="chip" text-anchor="middle">Troubleshooting</text>
  <rect x="976" y="530" width="160" height="42" rx="10" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="1056" y="556" class="chip" text-anchor="middle">Simulazioni</text>

  <text x="56" y="610" class="small">I pesi sommano a 100: nessun dominio si pu&#242; saltare, ma troubleshooting vale quasi un terzo.</text>
  <text x="56" y="634" class="small">Illustrazione Adripedia &#183; dati dalla pagina ufficiale della certificazione CKA.</text>
</svg>
