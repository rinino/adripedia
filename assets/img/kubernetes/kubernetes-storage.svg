<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Storage Kubernetes: dal Pod al disco</title>
  <desc id="desc">Un Pod monta un PersistentVolumeClaim; il claim viene collegato a un PersistentVolume. Una StorageClass crea i volumi in modo dinamico tramite un driver CSI, che parla con il disco reale. I volumi effimeri come emptyDir e hostPath non passano dal ciclo PVC.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383e2"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .box-title { font: 600 20px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .box-sub { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .mono { font: 600 16px "Consolas", "Courier New", monospace; fill: #1f6fb2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="658" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="64" class="label">STORAGE</text>
  <text x="56" y="100" class="title">Dal Pod al disco</text>
  <text x="56" y="128" class="small">Il Pod chiede, il claim prenota, il volume conserva. Il driver parla con l'infrastruttura.</text>

  <!-- Riga 1 -->
  <rect x="56" y="170" width="220" height="130" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="76" y="204" class="box-title">Pod</text>
  <text x="76" y="228" class="box-sub">monta il volume</text>
  <rect x="76" y="244" width="180" height="38" rx="8" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="90" y="268" class="tiny">volumeMounts</text>

  <rect x="330" y="170" width="230" height="130" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="350" y="204" class="box-title">PVC</text>
  <text x="350" y="228" class="box-sub">PersistentVolumeClaim</text>
  <rect x="350" y="244" width="190" height="38" rx="8" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="364" y="268" class="tiny">5Gi &#183; ReadWriteOnce</text>

  <rect x="614" y="170" width="230" height="130" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="634" y="204" class="box-title">PV</text>
  <text x="634" y="228" class="box-sub">PersistentVolume</text>
  <rect x="634" y="244" width="190" height="38" rx="8" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="648" y="268" class="tiny">capacit&#224; e access mode</text>

  <rect x="896" y="170" width="248" height="130" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="916" y="204" class="box-title">StorageClass + CSI</text>
  <text x="916" y="228" class="box-sub">crea il volume su richiesta</text>
  <rect x="916" y="244" width="208" height="38" rx="8" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="930" y="268" class="tiny">provisioner: driver CSI</text>

  <path d="M 276 235 H 326" fill="none" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="278" y="226" class="tiny">mount</text>
  <path d="M 560 235 H 610" fill="none" stroke="#2383e2" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="562" y="226" class="tiny">binding</text>
  <path d="M 892 235 H 848" fill="none" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="850" y="252" class="tiny">provisioning</text>

  <!-- Riga 2 -->
  <rect x="56" y="340" width="250" height="120" rx="14" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="76" y="372" class="box-title">emptyDir</text>
  <text x="76" y="396" class="box-sub">vita del Pod</text>
  <text x="76" y="424" class="tiny">spazio temporaneo condiviso</text>
  <text x="76" y="444" class="tiny">cancellato con il Pod</text>

  <rect x="330" y="340" width="230" height="120" rx="14" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="350" y="372" class="box-title">hostPath</text>
  <text x="350" y="396" class="box-sub">cartella del nodo</text>
  <text x="350" y="424" class="tiny">legata a un nodo specifico</text>
  <text x="350" y="444" class="tiny">da usare con cautela</text>

  <rect x="584" y="340" width="250" height="120" rx="14" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="604" y="372" class="box-title">configMap / secret</text>
  <text x="604" y="396" class="box-sub">file di configurazione</text>
  <text x="604" y="424" class="tiny">montati in sola lettura</text>
  <text x="604" y="444" class="tiny">aggiornati dal kubelet</text>

  <rect x="858" y="340" width="286" height="120" rx="14" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="878" y="372" class="box-title">Storage fisico</text>
  <text x="878" y="396" class="box-sub">disco locale, SAN, NFS o cloud</text>
  <text x="878" y="424" class="tiny">il driver CSI traduce le richieste</text>
  <text x="878" y="444" class="tiny">snapshot, resize e attach</text>

  <path d="M 1020 300 V 336" fill="none" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1030" y="322" class="tiny">I/O</text>

  <!-- Nota -->
  <rect x="56" y="490" width="1088" height="72" rx="16" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="80" y="518" class="body">Il PVC &#232; la richiesta, il PV &#232; la risorsa, la StorageClass &#232; il modo in cui la risorsa viene creata.</text>
  <text x="80" y="546" class="small">I volumi effimeri non passano da PVC e PV: seguono il ciclo di vita del Pod o del nodo.</text>

  <text x="56" y="616" class="small">Illustrazione Adripedia &#183; concetti dalla documentazione Kubernetes.</text>
</svg>
