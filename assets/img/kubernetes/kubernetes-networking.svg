<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Networking Kubernetes: dal client esterno al Pod</title>
  <desc id="desc">Il traffico esterno arriva a un Ingress o a un Gateway API, che instrada verso un Service; il Service seleziona i Pod per label. kube-proxy programma le regole di rete, il CNI collega i Pod, CoreDNS risolve i nomi dei Service e le NetworkPolicy filtrano il traffico.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383e2"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .box-title { font: 600 20px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .box-sub { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .mono { font: 600 16px "Consolas", "Courier New", monospace; fill: #1f6fb2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="658" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="64" class="label">NETWORKING</text>
  <text x="56" y="100" class="title">Dal client esterno al Pod</text>
  <text x="56" y="128" class="small">Ingresso, Service, Pod, DNS e policy: ogni strato ha un compito preciso.</text>

  <!-- Riga 1 -->
  <rect x="56" y="180" width="190" height="90" rx="14" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="76" y="214" class="box-title">Client</text>
  <text x="76" y="238" class="box-sub">Internet o rete aziendale</text>

  <rect x="300" y="160" width="250" height="130" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="320" y="194" class="box-title">Ingress / Gateway API</text>
  <text x="320" y="218" class="box-sub">instrada per host e path</text>
  <rect x="320" y="234" width="210" height="38" rx="8" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="334" y="258" class="tiny">serve un controller dedicato</text>

  <rect x="600" y="160" width="230" height="130" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="620" y="194" class="box-title">Service</text>
  <text x="620" y="218" class="box-sub">ClusterIP stabile</text>
  <rect x="620" y="234" width="190" height="38" rx="8" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="634" y="258" class="mono">10.96.0.0/12</text>

  <rect x="880" y="180" width="264" height="90" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="900" y="214" class="box-title">Pod</text>
  <text x="900" y="238" class="box-sub">app=web, porte 8080</text>

  <path d="M 246 225 H 296" fill="none" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="216" class="tiny">HTTPS</text>
  <path d="M 550 225 H 596" fill="none" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="552" y="216" class="tiny">regole</text>
  <path d="M 830 225 H 876" fill="none" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="832" y="216" class="tiny">label</text>

  <!-- Riga 2 -->
  <rect x="56" y="340" width="250" height="120" rx="14" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="76" y="372" class="box-title">kube-proxy</text>
  <text x="76" y="396" class="box-sub">programma le regole del Service</text>
  <text x="76" y="424" class="tiny">iptables, IPVS o nftables</text>
  <text x="76" y="444" class="tiny">su ogni nodo</text>

  <rect x="326" y="340" width="250" height="120" rx="14" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="346" y="372" class="box-title">CNI</text>
  <text x="346" y="396" class="box-sub">rete dei Pod e routing tra nodi</text>
  <text x="346" y="424" class="tiny">Calico, Cilium, Flannel</text>
  <text x="346" y="444" class="tiny">overlay o routing nativo</text>

  <rect x="596" y="340" width="250" height="120" rx="14" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="616" y="372" class="box-title">CoreDNS</text>
  <text x="616" y="396" class="box-sub">nomi dei Service e dei Pod</text>
  <text x="616" y="424" class="mono">web.default.svc</text>
  <text x="616" y="444" class="tiny">.cluster.local</text>

  <rect x="866" y="340" width="278" height="120" rx="14" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="886" y="372" class="box-title">NetworkPolicy</text>
  <text x="886" y="396" class="box-sub">filtra il traffico tra Pod</text>
  <text x="886" y="424" class="tiny">ingress ed egress</text>
  <text x="886" y="444" class="tiny">efficace solo con un CNI compatibile</text>

  <path d="M 715 290 V 336" fill="none" stroke="#2383e2" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="725" y="318" class="tiny">regole</text>

  <!-- Nota -->
  <rect x="56" y="490" width="1088" height="72" rx="16" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="80" y="518" class="body">Un Service &#232; un nome e un indirizzo virtuale: non &#232; un processo e non ha un Pod tutto suo.</text>
  <text x="80" y="546" class="small">Il traffico viene tradotto verso gli endpoint selezionati; Ingress e Gateway API aggiungono il livello HTTP.</text>

  <text x="56" y="616" class="small">Illustrazione Adripedia &#183; concetti dalla documentazione Kubernetes.</text>
</svg>
