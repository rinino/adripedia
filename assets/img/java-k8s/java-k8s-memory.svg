<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Memoria di una JVM dentro un container Kubernetes</title>
  <desc id="desc">Un Pod Kubernetes con un limite di memoria di 1 GiB. Dentro il container, la JVM usa al massimo il 75 per cento del limite per l'heap e lascia il 25 per cento a metaspace, code cache, stack dei thread, buffer diretti e strutture del garbage collector. Se l'heap occupa tutto il limite, il kernel termina il container con OOMKilled.</desc>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .box-title { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .box-sub { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .chip { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #1f6fb2; }
      .mono { font: 600 15px "Consolas", "Courier New", monospace; fill: #1f6fb2; }
      .metric { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .warn { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #c0392b; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="758" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="64" class="label">MEMORIA</text>
  <text x="56" y="100" class="title">La JVM non Ã¨ sola nel container</text>
  <text x="56" y="128" class="small">Il limite del Pod vale per tutto il processo: heap, metaspace, stack, buffer e strutture del GC.</text>

  <!-- Pod -->
  <rect x="56" y="164" width="700" height="500" rx="20" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="80" y="196" class="label">POD KUBERNETES</text>
  <text x="80" y="228" class="box-title">orders-api</text>
  <text x="80" y="252" class="box-sub">resources.limits.memory: 1Gi</text>

  <!-- Container -->
  <rect x="80" y="276" width="652" height="360" rx="16" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="100" y="306" class="label">CONTAINER</text>
  <text x="100" y="336" class="box-title">JVM + applicazione Spring Boot</text>
  <text x="100" y="359" class="tiny">Il cgroup limita l'intero processo a 1 GiB, non solo l'heap.</text>

  <!-- Heap -->
  <rect x="100" y="380" width="432" height="248" rx="12" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="120" y="410" class="label">HEAP</text>
  <text x="120" y="440" class="metric">768 MiB</text>
  <text x="230" y="440" class="chip">75% del limite</text>
  <text x="120" y="466" class="tiny">-XX:MaxRAMPercentage=75.0</text>
  <rect x="120" y="484" width="392" height="34" rx="8" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="132" y="506" class="tiny">oggetti, young + old generation</text>
  <rect x="120" y="526" width="392" height="34" rx="8" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="132" y="548" class="tiny">G1: region, remembered set, card table</text>
  <text x="120" y="588" class="tiny">L'heap puÃ² crescere fino al 75%: non Ã¨ tutto il processo.</text>

  <!-- Non heap -->
  <rect x="548" y="380" width="164" height="248" rx="12" fill="#ffffff" stroke="#d8d7d3"/>
  <text x="564" y="410" class="label">NON-HEAP</text>
  <text x="564" y="440" class="metric">256 MiB</text>
  <text x="564" y="466" class="tiny">il resto del limite</text>
  <text x="564" y="492" class="tiny">metaspace</text>
  <text x="564" y="512" class="tiny">code cache JIT</text>
  <text x="564" y="532" class="tiny">stack dei thread</text>
  <text x="564" y="552" class="tiny">buffer diretti</text>
  <text x="564" y="572" class="tiny">JVM interna</text>
  <text x="564" y="592" class="tiny">cresce con classi</text>
  <text x="564" y="608" class="tiny">e thread.</text>

  <!-- Limit bar -->
  <text x="80" y="682" class="tiny">1 GiB = limite del container</text>
  <rect x="80" y="694" width="484" height="18" rx="9" fill="#b9d7f2"/>
  <rect x="564" y="694" width="164" height="18" rx="9" fill="#d8d7d3"/>
  <text x="80" y="730" class="tiny">heap 75%</text>
  <text x="564" y="730" class="tiny">non-heap 25%</text>

  <!-- Right side -->
  <rect x="792" y="164" width="352" height="238" rx="18" fill="#fdf2f0" stroke="#e8c4bd" stroke-width="2"/>
  <text x="816" y="196" class="label">ERRORE COMUNE</text>
  <text x="816" y="228" class="box-title">-Xmx1g con limite 1Gi</text>
  <text x="816" y="254" class="box-sub">L'heap occupa tutto il container.</text>
  <text x="816" y="276" class="box-sub">Metaspace e stack non hanno spazio.</text>
  <text x="816" y="310" class="warn">Il kernel uccide il processo: OOMKilled</text>
  <text x="816" y="332" class="tiny">exit code 137, nessun heap dump, nessun log.</text>
  <text x="816" y="366" class="tiny">Regola pratica: heap â‰¤ 70â€“75% del limite,</text>
  <text x="816" y="384" class="tiny">oppure un limite piÃ¹ grande.</text>

  <!-- Request vs limit -->
  <rect x="792" y="426" width="352" height="238" rx="18" fill="#ffffff" stroke="#d8d7d3" stroke-width="2"/>
  <text x="816" y="458" class="label">REQUESTS E LIMITS</text>
  <text x="816" y="490" class="box-title">La JVM legge il limit</text>
  <text x="816" y="516" class="box-sub">Non le requests. Se il limit manca,</text>
  <text x="816" y="538" class="box-sub">la JVM vede la memoria del nodo.</text>
  <text x="816" y="572" class="tiny">Con requests = limits il Pod Ã¨ Guaranteed:</text>
  <text x="816" y="590" class="tiny">meno eviction e sizing prevedibile.</text>
  <text x="816" y="624" class="mono">kubectl describe pod orders-api</text>
  <text x="816" y="646" class="tiny">cerca OOMKilled e l'exit code 137.</text>

  <line x1="756" y1="284" x2="792" y2="284" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow-red)"/>
</svg>
