<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Architettura di WSL 2</title>
  <desc id="desc">Windows esegue WSL 2 in una macchina virtuale leggera con un kernel Linux condiviso. Le distribuzioni Linux hanno file system e processi isolati e comunicano con Windows tramite wsl.exe e i file system montati.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383e2"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .box-title { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .box-sub { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .mono { font: 600 16px "Consolas", "Courier New", monospace; fill: #1f6fb2; }
      .accent { fill: #2383e2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="618" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="72" class="label">WINDOWS 11</text>
  <text x="56" y="108" class="title">Host Windows</text>
  <text x="56" y="136" class="small">Desktop, file e applicazioni restano su Windows.</text>

  <!-- Windows side -->
  <rect x="56" y="174" width="390" height="318" rx="20" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="86" y="214" class="box-title">Windows</text>
  <text x="86" y="243" class="box-sub">PowerShell &#183; Windows Terminal</text>

  <rect x="86" y="268" width="330" height="62" rx="12" fill="#ffffff" stroke="#e2e1dd"/>
  <text x="110" y="295" class="body">File system</text>
  <text x="110" y="317" class="mono">C:\Users\Adr</text>

  <rect x="86" y="344" width="330" height="62" rx="12" fill="#ffffff" stroke="#e2e1dd"/>
  <text x="110" y="371" class="body">Applicazioni</text>
  <text x="110" y="393" class="small">Editor, browser, strumenti Windows</text>

  <rect x="86" y="420" width="330" height="50" rx="12" fill="#eaf3fc" stroke="#b9d7f2"/>
  <text x="110" y="451" class="mono">wsl.exe</text>

  <!-- WSL VM -->
  <rect x="520" y="174" width="624" height="318" rx="20" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="552" y="214" class="box-title">WSL 2</text>
  <text x="552" y="243" class="box-sub">Macchina virtuale leggera gestita da WSL</text>

  <rect x="552" y="268" width="560" height="58" rx="12" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="576" y="294" class="body">Kernel Linux condiviso</text>
  <text x="576" y="315" class="mono">6.18.54.1</text>

  <rect x="552" y="344" width="172" height="126" rx="12" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="574" y="374" class="box-title">Ubuntu</text>
  <text x="574" y="400" class="small">Bash, apt, systemd</text>
  <text x="574" y="424" class="small">File system proprio</text>
  <text x="574" y="448" class="small">Processi isolati</text>

  <rect x="744" y="344" width="172" height="126" rx="12" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="766" y="374" class="box-title">Debian</text>
  <text x="766" y="400" class="small">Bash, apt, systemd</text>
  <text x="766" y="424" class="small">File system proprio</text>
  <text x="766" y="448" class="small">Processi isolati</text>

  <rect x="936" y="344" width="176" height="126" rx="12" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="958" y="374" class="box-title">Kali</text>
  <text x="958" y="400" class="small">Bash, apt, systemd</text>
  <text x="958" y="424" class="small">File system proprio</text>
  <text x="958" y="448" class="small">Processi isolati</text>

  <!-- Arrows -->
  <line x1="452" y1="250" x2="508" y2="250" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="230" text-anchor="middle" class="mono">wsl</text>

  <line x1="508" y1="443" x2="452" y2="443" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="452" y1="458" x2="508" y2="458" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="490" text-anchor="middle" class="small">/mnt/c e</text>
  <text x="480" y="510" text-anchor="middle" class="small">\\wsl.localhost</text>

  <text x="56" y="556" class="small">Le distribuzioni condividono il kernel della VM, ma restano isolate tra loro e da Windows.</text>
  <text x="56" y="582" class="small">Illustrazione Adripedia &#183; concetti da Microsoft Learn.</text>
</svg>
