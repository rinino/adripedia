<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Reti Docker: bridge, DNS interno e porte pubblicate</title>
  <desc id="desc">Due container, web e db, sono collegati alla stessa rete bridge definita dall'utente e si raggiungono per nome tramite il DNS interno. Solo la porta pubblicata di web è raggiungibile dall'host; il traffico in uscita passa dal NAT dell'host.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383e2"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .box-title { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .box-sub { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .mono { font: 600 16px "Consolas", "Courier New", monospace; fill: #1f6fb2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="678" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="64" class="label">RETE</text>
  <text x="56" y="100" class="title">Bridge, DNS interno e porte pubblicate</text>
  <text x="56" y="128" class="small">I container si parlano per nome; solo le porte pubblicate escono dall'host.</text>

  <!-- Host -->
  <rect x="56" y="156" width="780" height="444" rx="22" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="86" y="192" class="label">HOST DOCKER</text>

  <!-- Container db -->
  <rect x="86" y="250" width="300" height="120" rx="16" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>
  <text x="110" y="286" class="box-title">db</text>
  <text x="110" y="312" class="mono">postgres:17</text>
  <text x="110" y="338" class="small">porta 5432</text>

  <!-- Container web -->
  <rect x="430" y="250" width="300" height="120" rx="16" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>
  <text x="454" y="286" class="box-title">web</text>
  <text x="454" y="312" class="mono">nginx:alpine</text>
  <text x="454" y="338" class="small">porta 80</text>

  <line x1="392" y1="310" x2="424" y2="310" stroke="#2383e2" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="408" y="238" class="tiny" text-anchor="middle">db:5432</text>

  <!-- Bridge -->
  <rect x="86" y="430" width="644" height="70" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="110" y="460" class="box-title">app-net</text>
  <text x="110" y="484" class="tiny">driver bridge &#183; rete definita dall'utente</text>
  <text x="706" y="460" class="tiny" text-anchor="end">DNS interno: db &#8594; 172.20.0.3</text>
  <text x="706" y="484" class="tiny" text-anchor="end">web &#8594; 172.20.0.2</text>

  <line x1="236" y1="370" x2="236" y2="426" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="402" class="tiny">eth0</text>
  <line x1="580" y1="370" x2="580" y2="426" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="592" y="402" class="tiny">eth0</text>

  <!-- Porta pubblicata -->
  <line x1="730" y1="310" x2="876" y2="310" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="803" y="296" class="tiny" text-anchor="middle">-p 8080:80</text>
  <rect x="880" y="260" width="264" height="110" rx="16" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="904" y="296" class="box-title">Browser</text>
  <text x="904" y="322" class="mono">localhost:8080</text>
  <text x="904" y="346" class="small">rete locale</text>

  <!-- NAT -->
  <line x1="730" y1="465" x2="876" y2="465" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="803" y="451" class="tiny" text-anchor="middle">NAT</text>
  <rect x="880" y="420" width="264" height="110" rx="16" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="904" y="456" class="box-title">Internet</text>
  <text x="904" y="482" class="mono">IP dell'host</text>
  <text x="904" y="506" class="small">masquerade</text>

  <text x="56" y="636" class="small">Sulla stessa rete il nome del container &#232; un hostname: web raggiunge db:5432 senza conoscere l'IP.</text>
  <text x="56" y="660" class="small">Illustrazione Adripedia &#183; concetti dalla documentazione Docker.</text>
</svg>
