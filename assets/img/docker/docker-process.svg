<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Dal comando docker al processo del container</title>
  <desc id="desc">Il client docker invia il comando al demone dockerd, che si appoggia a containerd. containerd avvia un containerd-shim e runc crea il container. Il processo del container diventa PID 1 nel proprio namespace, genera processi figli e riceve i segnali tramite lo shim.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383e2"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbde8"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .box-title { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .box-sub { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .mono { font: 600 16px "Consolas", "Courier New", monospace; fill: #1f6fb2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="658" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="64" class="label">PROCESSI</text>
  <text x="56" y="100" class="title">Dal comando al processo</text>
  <text x="56" y="128" class="small">Il client parla al demone; containerd e runc creano il container, lo shim resta come genitore.</text>

  <!-- Prima riga -->
  <rect x="56" y="160" width="190" height="100" rx="14" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>
  <text x="78" y="198" class="mono">docker run</text>
  <text x="78" y="226" class="small">client CLI</text>

  <rect x="296" y="160" width="220" height="100" rx="14" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>
  <text x="318" y="198" class="mono">dockerd</text>
  <text x="318" y="226" class="small">API e gestione</text>

  <rect x="566" y="160" width="210" height="100" rx="14" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>
  <text x="588" y="198" class="mono">containerd</text>
  <text x="588" y="226" class="small">runtime manager</text>

  <rect x="826" y="160" width="318" height="100" rx="14" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="848" y="198" class="mono">containerd-shim</text>
  <text x="848" y="226" class="small">resta come genitore del processo</text>

  <line x1="246" y1="210" x2="292" y2="210" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="269" y="196" class="tiny" text-anchor="middle">API</text>
  <line x1="516" y1="210" x2="562" y2="210" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="539" y="196" class="tiny" text-anchor="middle">OCI</text>
  <line x1="776" y1="210" x2="822" y2="210" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="799" y="196" class="tiny" text-anchor="middle">spawn</text>

  <!-- Supervisione -->
  <line x1="826" y1="240" x2="762" y2="306" stroke="#8fbde8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-soft)"/>
  <text x="812" y="296" class="tiny" text-anchor="middle">supervisione</text>

  <!-- runc -->
  <rect x="826" y="330" width="180" height="80" rx="14" fill="#ffffff" stroke="#b9d7f2" stroke-width="2"/>
  <text x="848" y="362" class="mono">runc</text>
  <text x="848" y="388" class="small">crea ed esce</text>

  <line x1="916" y1="260" x2="916" y2="326" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="928" y="300" class="tiny">invoca</text>

  <!-- Processo del container -->
  <rect x="400" y="310" width="370" height="130" rx="16" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="424" y="344" class="box-title">Processo del container</text>
  <text x="424" y="372" class="mono">PID 1 &#183; nginx</text>
  <text x="424" y="398" class="small">namespace + cgroup</text>
  <text x="424" y="422" class="small">stdout/stderr &#8594; docker logs</text>

  <line x1="826" y1="370" x2="774" y2="370" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="358" class="tiny" text-anchor="middle">crea</text>

  <!-- Processi figli -->
  <rect x="56" y="320" width="300" height="110" rx="16" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>
  <text x="80" y="354" class="box-title">Processi figli</text>
  <text x="80" y="382" class="mono">PID 2, 3, ...</text>
  <text x="80" y="408" class="small">stesso namespace</text>

  <line x1="400" y1="390" x2="360" y2="390" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="380" y="378" class="tiny" text-anchor="middle">fork</text>

  <!-- Nota -->
  <rect x="56" y="480" width="1088" height="90" rx="16" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="86" y="516" class="body">PID 1 riceve i segnali di <tspan class="mono">docker stop</tspan>. Se non li gestisce, il container non si ferma in modo pulito.</text>
  <text x="86" y="546" class="small">Usa <tspan class="mono">--init</tspan> (tini) per inoltrare i segnali e raccogliere i processi zombie.</text>

  <text x="56" y="612" class="small">Il container non &#232; un processo del demone: ha una vita propria, ma resta un processo del kernel.</text>
  <text x="56" y="636" class="small">Illustrazione Adripedia &#183; concetti dalla documentazione Docker.</text>
</svg>
