<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Isolamento di due container Docker</title>
  <desc id="desc">Due container hanno namespace, cgroup, capability e profili di sicurezza separati. Entrambi usano lo stesso kernel Linux dell'host: i namespace limitano ciò che vedono, i cgroup limitano quanto consumano.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383e2"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .label { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #787774; letter-spacing: 1.4px; }
      .body { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .small { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .box-title { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .box-sub { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #787774; }
      .chip { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #37352f; }
      .mono { font: 600 16px "Consolas", "Courier New", monospace; fill: #1f6fb2; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="658" rx="26" fill="#ffffff" stroke="#e2e1dd" stroke-width="2"/>

  <text x="56" y="64" class="label">ISOLAMENTO</text>
  <text x="56" y="100" class="title">Cosa separa un container</text>
  <text x="56" y="128" class="small">Namespace, cgroup e permessi sopra un unico kernel Linux.</text>

  <!-- Container web -->
  <rect x="56" y="164" width="520" height="300" rx="20" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="86" y="204" class="box-title">Container web</text>
  <text x="86" y="230" class="box-sub">PID 1: nginx</text>

  <rect x="86" y="252" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="100" y="280" class="chip">PID &#183; processi</text>
  <rect x="330" y="252" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="344" y="280" class="chip">NET &#183; interfacce e porte</text>

  <rect x="86" y="306" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="100" y="334" class="chip">MNT &#183; file system</text>
  <rect x="330" y="306" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="344" y="334" class="chip">UTS &#183; hostname</text>

  <rect x="86" y="360" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="100" y="388" class="chip">IPC &#183; code e memorie</text>
  <rect x="330" y="360" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="344" y="388" class="chip">USER &#183; UID e GID</text>

  <rect x="86" y="416" width="460" height="34" rx="8" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="100" y="438" class="tiny">cgroup v2 &#183; capability &#183; seccomp &#183; AppArmor/SELinux</text>

  <!-- Container db -->
  <rect x="624" y="164" width="520" height="300" rx="20" fill="#eaf3fc" stroke="#b9d7f2" stroke-width="2"/>
  <text x="654" y="204" class="box-title">Container db</text>
  <text x="654" y="230" class="box-sub">PID 1: postgres</text>

  <rect x="654" y="252" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="668" y="280" class="chip">PID &#183; processi</text>
  <rect x="898" y="252" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="912" y="280" class="chip">NET &#183; interfacce e porte</text>

  <rect x="654" y="306" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="668" y="334" class="chip">MNT &#183; file system</text>
  <rect x="898" y="306" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="912" y="334" class="chip">UTS &#183; hostname</text>

  <rect x="654" y="360" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="668" y="388" class="chip">IPC &#183; code e memorie</text>
  <rect x="898" y="360" width="216" height="44" rx="10" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="912" y="388" class="chip">USER &#183; UID e GID</text>

  <rect x="654" y="416" width="460" height="34" rx="8" fill="#ffffff" stroke="#b9d7f2"/>
  <text x="668" y="438" class="tiny">cgroup v2 &#183; capability &#183; seccomp &#183; AppArmor/SELinux</text>

  <!-- Separazione -->
  <line x1="600" y1="200" x2="600" y2="430" stroke="#c9c7c2" stroke-width="2" stroke-dasharray="6 7"/>
  <text x="600" y="315" class="small" text-anchor="middle" transform="rotate(-90 600 315)">isolati</text>

  <!-- Kernel -->
  <rect x="56" y="492" width="1088" height="80" rx="16" fill="#f7f6f3" stroke="#d8d7d3" stroke-width="2"/>
  <text x="86" y="528" class="box-title">Kernel Linux dell'host</text>
  <text x="86" y="552" class="small">scheduler, rete, driver, chiamate di sistema</text>
  <text x="1114" y="540" class="mono" text-anchor="end">condiviso</text>

  <line x1="316" y1="464" x2="316" y2="488" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="484" class="tiny">syscall</text>
  <line x1="884" y1="464" x2="884" y2="488" stroke="#2383e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="898" y="484" class="tiny">syscall</text>

  <text x="56" y="610" class="small">I namespace limitano ci&#242; che un processo vede; i cgroup limitano quanto consuma.</text>
  <text x="56" y="634" class="small">Illustrazione Adripedia &#183; concetti dalla documentazione Docker.</text>
</svg>
